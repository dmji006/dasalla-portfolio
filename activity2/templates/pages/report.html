{% extends "pages/base.html" %}
{% load static %}

{% block content %}
    <div class="reports-wrapper">
        <h2 class="section-title">Reports</h2>
        
        <div class="reports-grid">
            <div class="report-card">
                <div class="report-icon">
                    <i class="fas fa-users"></i>
                </div>
                <p class="report-title">Total Users</p>
                <p class="report-value counter" data-target="1250">0</p>
            </div>

            <div class="report-card">
                <div class="report-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <p class="report-title">Orders Processed</p>
                <p class="report-value counter" data-target="3500">0</p>
            </div>

            <div class="report-card">
                <div class="report-icon">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <p class="report-title">Total Revenue</p>
                <p class="report-value counter" data-target="250000">$0</p>
            </div>

            <div class="report-card">
                <div class="report-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <p class="report-title">Monthly Growth</p>
                <p class="report-value counter" data-target="8.5">0%</p>
            </div>
        </div>
    </div>

    <script>
        // Animated Counter for Reports
        document.addEventListener("DOMContentLoaded", () => {
            const counters = document.querySelectorAll(".counter");

            counters.forEach(counter => {
                let target = +counter.getAttribute("data-target");
                let count = 0;
                let increment = target / 100;

                function updateCounter() {
                    if (count < target) {
                        count += increment;
                        counter.innerText = Math.floor(count);
                        requestAnimationFrame(updateCounter);
                    } else {
                        counter.innerText = target;
                    }
                }
                updateCounter();
            });
        });
    </script>
{% endblock %}
