<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>




@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600;700&display=swap");

/* Global Variables */
:root {
    --primary: #b57edc;
    --primary-hover: #9a66c1;
    --dark-primary: #5a2d82;
    --dark-secondary: #3d1c5c;
    --text-color: #2a1e42;
    --background: #f3e8ff;
    --card-bg: #fff;
    --shadow: rgba(0, 0, 0, 0.15);
    --border-radius: 10px;
    --transition-speed: 0.2s;
}

* {
    font-family: "Poppins", sans-serif;
    color: var(--text-color);
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--background);
    padding-top: 80px;
    transition: var(--transition-speed);
}


/* Dashboard Styling */
.dashboard-wrapper {
    margin-right: 120px;
    padding: 20px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.dashboard-card {
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    padding: 30px;
    border-radius: var(--border-radius);
    text-align: center;
    box-shadow: 6px 8px 16px rgba(0, 0, 0, 0.15);
    transition: 0.4s ease-in-out;
    position: relative;
    overflow: hidden;
    color: white;
    cursor: pointer;
}

.dashboard-card:hover {
    transform: scale(1.05);
    box-shadow: 8px 12px 20px rgba(0, 0, 0, 0.2);
}

.dashboard-icon {
    font-size: 2.5rem;
    color: white;
    background: rgba(255, 255, 255, 0.2);
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    transition: 0.3s;
}

.dashboard-card:hover .dashboard-icon {
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(10deg);
}

.dashboard-title {
    font-size: 1.2rem;
    font-weight: 500;
    color: #fff;
}

.dashboard-value {
    font-size: 2.5rem;
    font-weight: 700;
    margin-top: 5px;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}



/* Navbar Styling */
.navbar {
    background: linear-gradient(135deg, var(--primary), var(--dark-primary));
    padding: 15px 35px;
    box-shadow: 0 4px 10px var(--shadow);
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 1000;
}

.navbar-brand {
    font-size: 2rem;
    font-weight: 600;
    color: white;
    text-decoration: none;
    transition: var(--transition-speed);
}

.navbar-brand:hover {
    color: #d6b3ff;
    text-shadow: 0 0 6px rgba(214, 179, 255, 0.7);
}

/* Sidebar Styling */
.sidebar {
    background-color: var(--dark-primary);
    padding: 20px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 200px;
    position: fixed;
    left: 0;
    top: 80px;
    transition: var(--transition-speed);
}

.sidebar a {
    color: #f3e8ff;
    text-decoration: none;
    padding: 12px;
    font-weight: 500;
    border-radius: var(--border-radius);
    transition: var(--transition-speed);
    display: flex;
    align-items: center;
}

.sidebar a:hover {
    background: var(--primary-hover);
    color: white;
}

/* Main Content Styling */
.main-content {
    margin-left: 220px;
    padding: 20px;
    transition: var(--transition-speed);
}

/* Card Styling */
.card {
    background: var(--card-bg);
    padding: 25px;
    border-radius: var(--border-radius);
    box-shadow: 2px 4px 10px var(--shadow);
    margin-bottom: 20px;
    transition: var(--transition-speed);
}

.card:hover {
    transform: translateY(-3px);
}

/* Grid for Data Cards */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

/* Data Card */
.data-card {
    background: #b57edc;
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.15);
    transition: 0.2s;
}

.data-card:hover {
    background: #9a66c1;
    transform: translateY(-3px);
}

/* Data Titles & Values */
.data-title {
    font-size: 1rem;
    font-weight: 500;
}

.data-value {
    font-size: 2rem;
    font-weight: 600;
}

/* Reports Section */
.reports-wrapper {
    margin-right: 120px;
    padding: 20px;
}

.reports-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

/* Report Cards */
.report-card {
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    padding: 30px;
    border-radius: var(--border-radius);
    text-align: center;
    box-shadow: 6px 8px 16px rgba(0, 0, 0, 0.15);
    transition: 0.4s ease-in-out;
    position: relative;
    overflow: hidden;
    color: white;
    cursor: pointer;
}

.report-card:hover {
    transform: scale(1.05);
    box-shadow: 8px 12px 20px rgba(0, 0, 0, 0.2);
}

/* Report Icon */
.report-icon {
    font-size: 2.5rem;  /* Adjusted for better balance */
    color: white;
    background: rgba(255, 255, 255, 0.2);
    width: 80px;   /* Fixed width */
    height: 80px;  /* Fixed height */
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;  /* Perfect circular shape */
    margin: 0 auto 15px auto;  /* Center alignment */
    transition: 0.3s;
}


.report-card:hover .report-icon {
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(10deg);
}

/* Report Titles & Values */
.report-title {
    font-size: 1.2rem;
    font-weight: 500;
    color: #fff;
}

.report-value {
    font-size: 2.5rem;
    font-weight: 700;
    margin-top: 5px;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

/* Animated Border Effect */
.report-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 10%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
}

.report-card:hover::before {
    opacity: 1;
}


/* Responsive Design */
@media (max-width: 768px) {
    .reports-grid {
        grid-template-columns: 1fr;
    }
}


/* Responsive Design */
@media (max-width: 768px) {
    .navbar {
        padding: 10px 20px;
    }

    .navbar-brand {
        font-size: 1.6rem;
    }

    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
        flex-direction: row;
        padding: 10px;
        overflow-x: auto;
    }

    .sidebar a {
        padding: 8px 12px;
    }

    .main-content {
        margin-left: 0;
        padding: 15px;
    }

    .card-grid {
        grid-template-columns: 1fr;
    }
}

.section-title {
    font-size: 3rem;
    font-weight: 600;
    margin-bottom: 20px;
}


/* === Enhanced Settings Page Styling === */
.settings-wrapper {
    margin-right: 120px;
    padding: 20px;
}

/* Grid Layout */
.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    margin-top: 20px;
}

/* Settings Cards */
.settings-card {
    background: linear-gradient(135deg, #9b5de5, #845ec2);
    padding: 35px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 8px 10px 20px rgba(0, 0, 0, 0.15);
    transition: 0.4s ease-in-out;
    position: relative;
    overflow: hidden;
    color: white;
    cursor: pointer;
}

/* Settings Icons */
.settings-icon {
    font-size: 3rem;
    color: white;
    background: rgba(255, 255, 255, 0.2);
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    transition: 0.3s;
}

.settings-card:hover .settings-icon {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
}

/* Settings Titles */
.settings-title {
    font-size: 1.3rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 8px;
}

/* btns Below Each Title */
.settings-btn {
    font-size: 1rem;
    font-weight: 500;
    padding: 8px 16px;
    background: white;
    color: #6d44b8;
    border: none;
    border-radius: 8px;
    transition: 0.3s;
    display: inline-block;
    text-decoration: none;
}

/* Animated Glow */
.settings-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 10%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
}

.settings-card:hover::before {
    opacity: 1;
}

/* Responsive Design */
@media (max-width: 768px) {
    .settings-grid {
        grid-template-columns: 1fr;
    }
}



    </style>
</head>
<body>

    {% include 'components/header.html' %}

    <div class="container-fluid">
        <div class="row">
            {% include 'components/sidebar.html' %}
            
            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

</body>
</html>
